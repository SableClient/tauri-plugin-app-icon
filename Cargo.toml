[package]
name = "tauri-plugin-app-icon"
version = "0.1.0"
authors = [ "Sable Maintainers" ]
description = "Runtime alternate app icon support for Tauri mobile apps"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SableClient/tauri-plugin-app-icon"
keywords = ["tauri", "plugin", "ios", "android", "app-icon"]
edition = "2021"
rust-version = "1.77.2"
exclude = ["/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-app-icon"

[dependencies]
tauri = { version = "2" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
serde_json = "1.0"
